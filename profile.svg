<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 960 1620" width="960" height="1620">
  <style>
    .tile-bg { transition: stroke .2s ease, filter .2s ease; }
    a:hover .tile-bg { stroke: rgba(55,118,171,0.65); }
    .btn { transition: fill .2s ease; }
    a:hover .btn { fill: #3776AB; }
  </style>

  <rect width="960" height="1620" fill="#0a0a0b"/>

  <!-- Карточка 1: Python Core -->
  <a xlink:href="python_core/README.md" href="python_core/README.md" target="_blank" rel="noopener">
    <g class="tile t1">
      <rect class="tile-bg" x="40" y="160" width="420" height="340" rx="14" fill="#111113" stroke="rgba(255,255,255,0.08)"/>
      <g transform="translate(40,160)">
        <text class="title" x="28" y="48" font-family="'Inter',sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" letter-spacing="-0.3">Python Core</text>
        <text x="28" y="90" font-family="'Inter',sans-serif" font-size="16" font-weight="400" fill="#a1a1aa">
          <tspan x="28" dy="28"><tspan fill="#f4f4f5" font-weight="600">Синтаксис</tspan>, переменные, типы данных,</tspan>
          <tspan x="28" dy="26">условия, циклы, функции,</tspan>
          <tspan x="28" dy="26">коллекции (<tspan fill="#f4f4f5" font-weight="600">list, dict, set, tuple</tspan>),</tspan>
          <tspan x="28" dy="26">ООП: классы, наследование,</tspan>
          <tspan x="28" dy="26">исключения, файлы, модули,</tspan>
          <tspan x="28" dy="26"><tspan fill="#f4f4f5" font-weight="600">venv / pip</tspan>, работа с зависимостями.</tspan>
        </text>
        <rect x="28" y="285" width="80" height="28" rx="6" fill="rgba(55,118,171,0.15)"/>
        <text x="68" y="304" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#3776AB" text-anchor="middle">Python</text>
        <rect x="118" y="285" width="60" height="28" rx="6" fill="rgba(55,118,171,0.15)"/>
        <text x="148" y="304" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#3776AB" text-anchor="middle">OOP</text>
        <text class="btn" x="392" y="305" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#71717a" text-anchor="end">Открыть →</text>
      </g>
    </g>
  </a>

  <!-- Карточка 2: Python FastAPI -->
  <a xlink:href="python_fastapi/README.md" href="python_fastapi/README.md" target="_blank" rel="noopener">
    <g class="tile t2">
      <rect class="tile-bg" x="500" y="160" width="420" height="340" rx="14" fill="#111113" stroke="rgba(255,255,255,0.08)"/>
      <g transform="translate(500,160)">
        <text class="title" x="28" y="48" font-family="'Inter',sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" letter-spacing="-0.3">Python FastAPI</text>
        <text x="28" y="90" font-family="'Inter',sans-serif" font-size="16" font-weight="400" fill="#a1a1aa">
          <tspan x="28" dy="28"><tspan fill="#f4f4f5" font-weight="600">Pydantic</tspan>, <tspan fill="#f4f4f5" font-weight="600">Alembic</tspan>, Type Hints,</tspan>
          <tspan x="28" dy="26">асинхронность (<tspan fill="#f4f4f5" font-weight="600">async / await</tspan>),</tspan>
          <tspan x="28" dy="26"><tspan fill="#f4f4f5" font-weight="600">PostgreSQL</tspan>, <tspan fill="#f4f4f5" font-weight="600">Redis</tspan>, тестирование</tspan>
          <tspan x="28" dy="26">(<tspan fill="#f4f4f5" font-weight="600">pytest</tspan>), <tspan fill="#f4f4f5" font-weight="600">CI/CD</tspan> (GitHub Actions),</tspan>
          <tspan x="28" dy="26"><tspan fill="#f4f4f5" font-weight="600">Nginx</tspan>, <tspan fill="#f4f4f5" font-weight="600">Gunicorn</tspan> и деплой.</tspan>
        </text>
        <rect x="28" y="285" width="80" height="28" rx="6" fill="rgba(55,118,171,0.15)"/>
        <text x="68" y="304" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#3776AB" text-anchor="middle">FastAPI</text>
        <rect x="118" y="285" width="80" height="28" rx="6" fill="rgba(55,118,171,0.15)"/>
        <text x="158" y="304" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#3776AB" text-anchor="middle">Docker</text>
        <text class="btn" x="392" y="305" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#71717a" text-anchor="end">Открыть →</text>
      </g>
    </g>
  </a>

  <!-- Карточка 3: Python Django -->
  <a xlink:href="python_Django/README.md" href="python_Django/README.md" target="_blank" rel="noopener">
    <g class="tile t3">
      <rect class="tile-bg" x="40" y="520" width="420" height="340" rx="14" fill="#111113" stroke="rgba(255,255,255,0.08)"/>
      <g transform="translate(40,520)">
        <text class="title" x="28" y="48" font-family="'Inter',sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" letter-spacing="-0.3">Python Django</text>
        <text x="28" y="90" font-family="'Inter',sans-serif" font-size="16" font-weight="400" fill="#a1a1aa">
          <tspan x="28" dy="28"><tspan fill="#f4f4f5" font-weight="600">Django ORM</tspan>, миграции, модели,</tspan>
          <tspan x="28" dy="26">админ-панель, шаблоны (<tspan fill="#f4f4f5" font-weight="600">Jinja2</tspan>),</tspan>
          <tspan x="28" dy="26">формы и аутентификация,</tspan>
          <tspan x="28" dy="26"><tspan fill="#f4f4f5" font-weight="600">Django REST Framework</tspan>:</tspan>
          <tspan x="28" dy="26">сериализаторы, <tspan fill="#f4f4f5" font-weight="600">ViewSets</tspan>,</tspan>
          <tspan x="28" dy="26">маршрутизация, деплой и <tspan fill="#f4f4f5" font-weight="600">PostgreSQL</tspan>.</tspan>
        </text>
        <rect x="28" y="285" width="80" height="28" rx="6" fill="rgba(55,118,171,0.15)"/>
        <text x="68" y="304" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#3776AB" text-anchor="middle">Django</text>
        <rect x="118" y="285" width="60" height="28" rx="6" fill="rgba(55,118,171,0.15)"/>
        <text x="148" y="304" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#3776AB" text-anchor="middle">DRF</text>
        <text class="btn" x="392" y="305" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#71717a" text-anchor="end">Открыть →</text>
      </g>
    </g>
  </a>

  <!-- Карточка 4: Python Pandas -->
  <a xlink:href="python_pandas/README.md" href="python_pandas/README.md" target="_blank" rel="noopener">
    <g class="tile t4">
      <rect class="tile-bg" x="500" y="520" width="420" height="340" rx="14" fill="#111113" stroke="rgba(255,255,255,0.08)"/>
      <g transform="translate(500,520)">
        <text class="title" x="28" y="48" font-family="'Inter',sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" letter-spacing="-0.3">Python Pandas</text>
        <text x="28" y="90" font-family="'Inter',sans-serif" font-size="16" font-weight="400" fill="#a1a1aa">
          <tspan x="28" dy="28"><tspan fill="#f4f4f5" font-weight="600">Series</tspan> и <tspan fill="#f4f4f5" font-weight="600">DataFrame</tspan>,</tspan>
          <tspan x="28" dy="26">индексация, фильтрация,</tspan>
          <tspan x="28" dy="26">группировка (<tspan fill="#f4f4f5" font-weight="600">groupby</tspan>), агрегация,</tspan>
          <tspan x="28" dy="26">объединение (<tspan fill="#f4f4f5" font-weight="600">merge / join</tspan>),</tspan>
          <tspan x="28" dy="26">временные ряды, очистка данных,</tspan>
          <tspan x="28" dy="26">визуализация (<tspan fill="#f4f4f5" font-weight="600">Matplotlib / Seaborn</tspan>).</tspan>
        </text>
        <rect x="28" y="285" width="80" height="28" rx="6" fill="rgba(55,118,171,0.15)"/>
        <text x="68" y="304" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#3776AB" text-anchor="middle">Pandas</text>
        <text class="btn" x="392" y="305" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#71717a" text-anchor="end">Открыть →</text>
      </g>
    </g>
  </a>

  <!-- Карточка 5: Python AI CS50 (на всю ширину) -->
  <a xlink:href="python_ai_cs50/README.md" href="python_ai_cs50/README.md" target="_blank" rel="noopener">
    <g class="tile t5">
      <rect class="tile-bg" x="40" y="880" width="880" height="340" rx="14" fill="#111113" stroke="rgba(255,255,255,0.08)"/>
      <g transform="translate(40,880)">
        <text class="title" x="28" y="48" font-family="'Inter',sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" letter-spacing="-0.3">Python AI — CS50</text>
        <text x="28" y="90" font-family="'Inter',sans-serif" font-size="16" font-weight="400" fill="#a1a1aa">
          <tspan x="28" dy="28">Введение в <tspan fill="#f4f4f5" font-weight="600">AI</tspan>: поиск, оптимизация, вероятностные модели,</tspan>
          <tspan x="28" dy="26">машинное обучение (<tspan fill="#f4f4f5" font-weight="600">supervised</tspan> / <tspan fill="#f4f4f5" font-weight="600">unsupervised</tspan>),</tspan>
          <tspan x="28" dy="26">нейронные сети (<tspan fill="#f4f4f5" font-weight="600">TensorFlow</tspan>, <tspan fill="#f4f4f5" font-weight="600">Keras</tspan>), <tspan fill="#f4f4f5" font-weight="600">NLP</tspan>,</tspan>
          <tspan x="28" dy="26">компьютерное зрение, <tspan fill="#f4f4f5" font-weight="600">reinforcement learning</tspan>,</tspan>
          <tspan x="28" dy="26">обработка данных и практические проекты</tspan>
          <tspan x="28" dy="26">по мотивам курса <tspan fill="#f4f4f5" font-weight="600">Harvard CS50 AI</tspan>.</tspan>
        </text>
        <rect x="28" y="285" width="60" height="28" rx="6" fill="rgba(55,118,171,0.15)"/>
        <text x="58" y="304" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#3776AB" text-anchor="middle">AI</text>
        <rect x="98" y="285" width="60" height="28" rx="6" fill="rgba(55,118,171,0.15)"/>
        <text x="128" y="304" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#3776AB" text-anchor="middle">ML</text>
        <text class="btn" x="852" y="305" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#71717a" text-anchor="end">Открыть →</text>
      </g>
    </g>
  </a>

  <!-- Карточка 6: C++ -->
  <a xlink:href="cpp/README.md" href="cpp/README.md" target="_blank" rel="noopener">
    <g class="tile t6">
      <rect class="tile-bg" x="40" y="1240" width="880" height="340" rx="14" fill="#111113" stroke="rgba(255,255,255,0.08)"/>
      <g transform="translate(40,1240)">
        <text class="title" x="28" y="48" font-family="'Inter',sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" letter-spacing="-0.3">C++ Developer</text>
        <text x="28" y="90" font-family="'Inter',sans-serif" font-size="16" font-weight="400" fill="#a1a1aa">
          <tspan x="28" dy="28"><tspan fill="#f4f4f5" font-weight="600">Синтаксис</tspan>, типы данных, указатели и ссылки,</tspan>
          <tspan x="28" dy="26">управление памятью (<tspan fill="#f4f4f5" font-weight="600">new / delete</tspan>), стек и куча,</tspan>
          <tspan x="28" dy="26">ООП: классы, наследование, полиморфизм, виртуальные функции,</tspan>
          <tspan x="28" dy="26"><tspan fill="#f4f4f5" font-weight="600">STL</tspan>: vector, map, set, алгоритмы и итераторы,</tspan>
          <tspan x="28" dy="26">шаблоны (<tspan fill="#f4f4f5" font-weight="600">templates</tspan>), <tspan fill="#f4f4f5" font-weight="600">RAII</tspan>, умные указатели,</tspan>
          <tspan x="28" dy="26">многопоточность (<tspan fill="#f4f4f5" font-weight="600">std::thread</tspan>), <tspan fill="#f4f4f5" font-weight="600">CMake</tspan> и сборка.</tspan>
        </text>
        <rect x="28" y="285" width="60" height="28" rx="6" fill="rgba(0,89,156,0.15)"/>
        <text x="58" y="304" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#00599C" text-anchor="middle">C++</text>
        <rect x="98" y="285" width="60" height="28" rx="6" fill="rgba(0,89,156,0.15)"/>
        <text x="128" y="304" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#00599C" text-anchor="middle">STL</text>
        <text class="btn" x="852" y="305" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#71717a" text-anchor="end">Открыть →</text>
      </g>
    </g>
  </a>
</svg>
